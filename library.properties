sentence=Drivers for black/white/red e-paper panels from SES-imagotag shelf labels: 7.4" (Pervasive E2741ES083), 5.81" (E2581JS061), 5.65" (E2565JS0B1) and 4.2" (E2417JS0D1).
paragraph=Epd74: 800x480, IST7x32. Epd581: 720x256 (VUSION 5.9), driver generation 06, parameters read from the panel OTP. Epd565: 600x448, IST7136, parameters read from the panel OTP. Epd42: 400x300, UC8176-compatible, adjustable temperature. Adafruit GFX based. Tested on the Waveshare e-Paper ESP32 Driver Board and the Seengreat ESP32-C6 E-Paper Driver Board.
category=Display
url=https://github.com/DocBigs-Lab/ses-imagotag-bwr-epaper
architectures=esp32
